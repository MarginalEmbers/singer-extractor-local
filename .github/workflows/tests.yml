name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu-tests:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install CPU PyTorch
        run: python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Install application and checks
        run: python -m pip install -e ".[dev]"
      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .
      - name: Run tests without external model downloads
        run: python -m pytest -q -o faulthandler_timeout=60
      - name: Timeline playback and range tests
        run: node --test tests/web.test.mjs
      - name: Compile Windows environment launcher
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .build | Out-Null
          'internal static class BuildInfo { internal const string ManifestHash = "ci-compile-only"; }' | Set-Content .build/BuildInfo.cs
          & "$env:SystemRoot\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:winexe /platform:x64 /reference:System.Windows.Forms.dll /reference:System.Drawing.dll /reference:System.Web.Extensions.dll /out:.build/launcher.exe /win32manifest:packaging/launcher.manifest packaging/Launcher.cs .build/BuildInfo.cs
          if ($LASTEXITCODE -ne 0) { throw "Launcher compilation failed" }
