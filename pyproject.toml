[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "singer-extractor-local"
version = "0.5.0"
description = "Experimental local target-singer extraction with a reference clip"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch==2.7.1",
    "numpy==2.4.6",
    "scipy==1.17.1",
    "soundfile==0.14.0",
    "fastapi==0.162.5",
    "uvicorn==0.54.0",
    "python-multipart==0.0.33",
    "gdown==6.5.1",
    "audioread==3.1.0",
    "beartype==0.14.1",
    "cloudpickle==3.1.2",
    "decorator==5.3.1",
    "einops==0.6.1",
    "joblib==1.6.0",
    "lazy-loader==0.6",
    "librosa==0.11.0",
    "llvmlite==0.50.0",
    "msgpack==1.2.4",
    "narwhals==2.28.0",
    "numba==0.68.1",
    "platformdirs==4.14.5",
    "pooch==1.9.0",
    "pyyaml==6.0.3",
    "rotary-embedding-torch==0.3.5",
    "scikit-learn==1.9.1",
    "soxr==1.1.0",
    "threadpoolctl==3.8.0",

]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.5", "httpx==0.28.1"]
desktop = ["PySide6==6.12.0"]
build = ["pyinstaller==6.22.3", "pyinstaller-hooks-contrib==2026.10"]

[project.scripts]
singer-extractor = "singer_extractor.cli:main"

[tool.setuptools.packages.find]
include = ["singer_extractor*"]

[tool.setuptools.package-data]
singer_extractor = ["web/*", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires downloaded research weights"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP"]
